<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinjaOne MCP - How It Works</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: #f5f5f5;
        }

        .diagram {
            /* LinkedIn optimal: 1200x628 or 1.91:1 ratio */
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 1.91 / 1;
            background: linear-gradient(135deg, #e8eef5 0%, #f5f7fb 100%);
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 80px;
            gap: 40px;
        }

        /* Background pattern overlay */
        .diagram::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: linear-gradient(45deg, rgba(255,0,110,0.03) 25%, transparent 25%, transparent 75%, rgba(255,0,110,0.03) 75%, rgba(255,0,110,0.03)),
                              linear-gradient(45deg, rgba(0,212,255,0.03) 25%, transparent 25%, transparent 75%, rgba(0,212,255,0.03) 75%, rgba(0,212,255,0.03));
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 5;
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        /* Left Side - NinjaOne */
        .platform {
            flex: 1;
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .platform-ninja {
            border: 3px solid #1a2840;
        }

        .platform-claude {
            border: 3px solid #00d4ff;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .ninja-text {
            color: #1a2840;
        }

        .claude-text {
            background: linear-gradient(135deg, #00d4ff, #0066cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .platform-name {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #1a1a2e;
        }

        .platform-info {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        /* Center - Bridge */
        .bridge {
            flex: 0.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            height: 100%;
        }

        .bridge-arrow {
            font-size: 48px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        .bridge-box {
            background: linear-gradient(135deg, #ff006e, #00d4ff);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 10px 40px rgba(255,0,110,0.3);
            white-space: nowrap;
        }

        .bridge-label {
            font-size: 12px;
            color: #999;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Tools Circle */
        .tools-mini {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
            width: 100%;
        }

        .tool-dot {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ff006e, #00d4ff);
            border-radius: 6px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        /* Stats Bar */
        .stats {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to right, #1a2840, #00d4ff);
            color: white;
            padding: 20px 80px;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            font-weight: 700;
            border-top: 3px solid rgba(255,0,110,0.3);
            z-index: 10;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 900;
            color: #ff006e;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Top Title */
        .title {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .title-text {
            font-size: 28px;
            font-weight: 900;
            color: #1a1a2e;
            letter-spacing: -1px;
        }

        .title-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
            font-weight: 600;
        }

        /* CTA Badge */
        .cta-badge {
            position: absolute;
            top: 20px;
            right: 30px;
            background: linear-gradient(135deg, #ff006e, #00d4ff);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 10;
        }

        @media (max-width: 1024px) {
            .diagram {
                padding: 50px 40px;
                flex-direction: column;
                gap: 20px;
            }

            .content {
                flex-direction: column;
            }

            .platform {
                width: 100%;
            }

            .bridge {
                flex: 1;
                width: 100%;
                flex-direction: row;
            }

            .stats {
                padding: 15px 20px;
                gap: 10px;
            }

            .title-text {
                font-size: 22px;
            }

            .cta-badge {
                font-size: 10px;
            }
        }

        /* Print friendly */
        @media print {
            body {
                background: white;
            }

            .diagram {
                box-shadow: none;
                border: 1px solid #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <div class="diagram">
        <!-- Title -->
        <div class="title">
            <div class="title-text">NinjaOne + Claude MCP</div>
            <div class="title-subtitle">AI-Powered Infrastructure Management</div>
        </div>

        <!-- CTA Badge -->
        <div class="cta-badge">OPEN SOURCE</div>

        <!-- Content -->
        <div class="content">
            <!-- NinjaOne Platform -->
            <div class="platform platform-ninja">
                <div class="logo">
                    <div class="logo-text ninja-text">ninja</div>
                </div>
                <div class="platform-name">NinjaOne RMM</div>
                <div class="platform-info">
                    Remote Monitoring<br/>250+ API Endpoints<br/>OAuth 2.0 Security
                </div>
            </div>

            <!-- Bridge/Connection -->
            <div class="bridge">
                <div class="bridge-arrow">⟶</div>
                <div class="bridge-box">🔗 MCP 🔗</div>
                <div class="bridge-arrow">⟵</div>
                <div class="tools-mini">
                    <div class="tool-dot">📱</div>
                    <div class="tool-dot">🔄</div>
                    <div class="tool-dot">🎫</div>
                    <div class="tool-dot">📊</div>
                    <div class="tool-dot">🛡️</div>
                    <div class="tool-dot">⚙️</div>
                </div>
            </div>

            <!-- Claude Platform -->
            <div class="platform platform-claude">
                <div class="logo">
                    <div class="logo-text claude-text">C</div>
                </div>
                <div class="platform-name">Claude AI</div>
                <div class="platform-info">
                    Natural Language<br/>20+ Tools<br/>AI-Powered Automation
                </div>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">20+</div>
                <div class="stat-label">TOOLS</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">250+</div>
                <div class="stat-label">ENDPOINTS</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">MIT</div>
                <div class="stat-label">LICENSE</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">GitHub</div>
                <div class="stat-label">OPEN SOURCE</div>
            </div>
        </div>
    </div>
</body>
</html>
