<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinjaOne MCP LinkedIn Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            background: #1a1a1a;
        }

        .post {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 1.91 / 1;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
        }

        /* Animated racing stripe background */
        .post::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, transparent 0%, rgba(255,0,110,0.05) 50%, transparent 100%),
                linear-gradient(45deg, transparent 30%, rgba(0,212,255,0.08) 70%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 5;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 80px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 48px;
            font-weight: 900;
            color: white;
            margin-bottom: 10px;
            letter-spacing: -2px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-title .highlight {
            background: linear-gradient(90deg, #ff006e, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 20px;
            color: #aaa;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Middle - Main Integration */
        .integration {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 30px;
            margin: 40px 0;
            flex: 1;
        }

        .platform-box {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            backdrop-filter: blur(10px);
            flex: 0.3;
        }

        .platform-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .platform-name {
            font-size: 22px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .platform-desc {
            font-size: 13px;
            color: #aaa;
            line-height: 1.4;
        }

        .bridge {
            flex: 0.4;
            text-align: center;
        }

        .bridge-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .arrow {
            font-size: 36px;
            color: #00d4ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .mcp-badge {
            background: linear-gradient(135deg, #ff006e 0%, #00d4ff 100%);
            color: white;
            padding: 18px 35px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 10px 40px rgba(255,0,110,0.4);
            display: inline-block;
        }

        .bridge-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            font-weight: 700;
        }

        /* Tools preview */
        .tools-preview {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .tool-mini {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 8px;
            padding: 8px;
            font-size: 18px;
            text-align: center;
            transition: all 0.3s;
        }

        .tool-mini:hover {
            background: rgba(0,212,255,0.2);
            border-color: rgba(0,212,255,0.6);
        }

        /* Footer - Stats & CTA */
        .footer {
            border-top: 2px solid rgba(255,255,255,0.1);
            padding-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats {
            display: flex;
            gap: 40px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(90deg, #ff006e, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .cta {
            background: linear-gradient(135deg, #ff006e, #00d4ff);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(0,212,255,0.3);
        }

        /* Mobile responsive */
        @media (max-width: 1024px) {
            .content {
                padding: 40px 40px;
            }

            .header-title {
                font-size: 36px;
            }

            .integration {
                gap: 20px;
            }

            .platform-box {
                padding: 25px;
            }

            .footer {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }

            .stats {
                width: 100%;
                justify-content: space-around;
            }
        }

        /* Print friendly */
        @media print {
            body {
                background: white;
            }

            .post {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="post">
        <!-- Header -->
        <div class="content">
            <div class="header">
                <div class="header-title">
                    NinjaOne <span class="highlight">+ Claude</span>
                </div>
                <div class="header-subtitle">AI-POWERED INFRASTRUCTURE MANAGEMENT</div>
            </div>

            <!-- Main Integration -->
            <div class="integration">
                <!-- NinjaOne -->
                <div class="platform-box">
                    <div class="platform-icon">🛡️</div>
                    <div class="platform-name">NinjaOne</div>
                    <div class="platform-desc">
                        Remote Monitoring<br/>
                        250+ Endpoints
                    </div>
                </div>

                <!-- Bridge -->
                <div class="bridge">
                    <div class="bridge-visual">
                        <div class="arrow">⟶</div>
                        <div class="mcp-badge">🔗 MCP 🔗</div>
                        <div class="arrow">⟵</div>
                    </div>
                    <div class="bridge-title">Model Context Protocol</div>
                    <div class="tools-preview">
                        <div class="tool-mini">📱</div>
                        <div class="tool-mini">🔄</div>
                        <div class="tool-mini">🎫</div>
                        <div class="tool-mini">📊</div>
                        <div class="tool-mini">🛡️</div>
                        <div class="tool-mini">⚙️</div>
                    </div>
                </div>

                <!-- Claude -->
                <div class="platform-box">
                    <div class="platform-icon">🤖</div>
                    <div class="platform-name">Claude AI</div>
                    <div class="platform-desc">
                        Natural Language<br/>
                        20+ Tools
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="stats">
                    <div class="stat">
                        <span class="stat-number">20+</span>
                        <span class="stat-label">Tools</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">250+</span>
                        <span class="stat-label">Endpoints</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">MIT</span>
                        <span class="stat-label">License</span>
                    </div>
                </div>
                <div class="cta">
                    ✨ Open Source on GitHub
                </div>
            </div>
        </div>
    </div>
</body>
</html>
